<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#245c37"><title>Hanzi Grader</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>html,body{height:100%;margin:0;background:#f5f4f0}iframe{display:block;border:0;width:100%;height:calc(100% - 42px);height:calc(100dvh - 42px)}#versionBar{min-height:42px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;background:#245c37;color:#fff;font:600 13px system-ui;letter-spacing:.02em}#missing{display:none;padding:24px;font:16px system-ui;color:#253a29}</style></head><body><div id="versionBar"><span id="shellVersion">Hanzi Grader · v023</span><span id="updateStatus" style="font-size:11px;font-weight:400" aria-live="polite"></span><button id="checkAppUpdate" style="border:1px solid white;border-radius:7px;padding:6px 9px;background:white;color:#245c37;font-weight:700">Check for update</button></div><iframe id="grader" title="Hanzi Grader" src="./Hanzi_Grader_v023.html"></iframe><div id="missing"><h1>Hanzi Grader setup</h1><p>Upload the v023 application file to this repository as <code>Hanzi_Grader_v023.html</code>. Keep the mnemonic database private: import its JSON from inside the grader.</p></div><script>document.getElementById('checkAppUpdate').onclick=async function(){
 const btn=this,msg=document.getElementById('updateStatus');btn.disabled=true;msg.textContent='Checking…';
 try{
  if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}
  const res=await fetch('./index.html?check='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);
  const m=(await res.text()).match(/Hanzi_Grader_v(\d{3})\.html/);if(!m)throw Error('Version unavailable');
  const latest=Number(m[1]);if(latest>23){
   const v='v'+String(latest).padStart(3,'0');msg.textContent='Opening '+v+'…';
   document.getElementById('grader').src='./Hanzi_Grader_'+v+'.html?fresh='+Date.now();
   document.getElementById('shellVersion').textContent='Hanzi Grader · '+v;
   msg.textContent='Updated; saved progress is retained.';
  }else msg.textContent='Already current (v023).';
 }catch(e){msg.textContent='Check failed: '+e.message}finally{btn.disabled=false}
};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));document.getElementById('grader').addEventListener('load',()=>{try{const d=document.getElementById('grader').contentDocument;if(d&&d.title==='Error')throw Error()}catch(e){}});</script></body></html>
